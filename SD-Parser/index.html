<!DOCTYPE html>
<!-- VIBECODED --> 
<html>
<head>
    <title>TERMINAL: HM-01</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --dark-bg: #020b10;
            --glow: 0 0 10px rgba(0, 242, 255, 0.7);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Scanline Effect Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            border-bottom: 2px solid var(--neon-cyan);
            text-shadow: var(--glow);
            letter-spacing: 5px;
            font-size: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            background: rgba(0, 242, 255, 0.05);
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .label { font-size: 0.7rem; color: rgba(0, 242, 255, 0.8); margin-bottom: 5px; }
        .val { font-size: 2.2rem; color: rgb(255, 242, 0); text-shadow: var(--glow); }
        .unit { font-size: 0.8rem; margin-left: 5px; }

        #status {
            margin-top: 20px;
            font-size: 0.8rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }

        select {
            background: black;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            font-family: monospace;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>[ SYSTEM_HEALTH_V3 ]</h1>
        <div style="margin-top: 10px;">
            SOURCE: 
            <select id="deviceSelect" onchange="startConnection()">
                <option value="blt">RFCOMM_0 (BT)</option>
                <option value="serial">TTY_USB0 (SERIAL)</option>
            </select>
        </div>
    </header>

    <div class="grid">
        <div class="box">
            <div class="label">Time (UTC)</div>
            <div id="utc" class="val">--:--:--</div>
        </div>
        <div class="box">
            <div class="label">Nav Fix Status</div>
            <div id="gps_status" class="val">--</div>
        </div>
        <div class="box">
            <div class="label">Coordinate North</div>
            <span id="lat" class="val">--.----</span> <span id="lato" class="unit">N</span>
        </div>
        <div class="box">
            <div class="label">Coordinate West</div>
            <span id="len" class="val">--.----</span> <span id="leno" class="unit">W</span>
        </div>
        <div class="box">
            <div class="label">Velocity</div>
            <span id="gps_speed" class="val">0.0</span> <span class="unit">KNOTS</span>
        </div>
        <div class="box">
            <div class="label">Heading</div>
            <span id="course" class="val">000</span> <span class="unit">DEG</span>
        </div>
    </div>

    <div id="status">> LINK_STATE: DISCONNECTED</div>

    <script>
        let socket;
        function startConnection() {
            if (socket) socket.close();
            const dev = document.getElementById('deviceSelect').value;
            socket = new WebSocket(`ws://127.0.0.1:5000/raw_ws?dev=${dev}`);

            const SCHEMA = [
                { name: 'time',                type: 'f64' }, // 8 bytes
                { name: 'altitude',            type: 'f32' }, // 4 bytes
                { name: 'velocity',            type: 'f32' },
                { name: 'horizontalVelocity',  type: 'f32' },
                { name: 'acceleration',        type: 'f32' },
                { name: 'accelerationX',       type: 'f32' },
                { name: 'accelerationY',       type: 'f32' },
                { name: 'accelerationZ',       type: 'f32' },
                { name: 'temperature',         type: 'f32' },
                { name: 'pressure',            type: 'f32' },
                { name: 'humidity',            type: 'f32' },
                { name: 'gpsLat',              type: 'f32' },
                { name: 'gpsLon',              type: 'f32' },
                { name: 'gpsLock',             type: 'f32' },
                { name: 'pitch',               type: 'f32' },
                { name: 'roll',                type: 'f32' },
                { name: 'yaw',                 type: 'f32' }
            ];

            socket.onmessage = async (event) => {
                const buffer = await event.data.arrayBuffer();
                const view = new DataView(buffer);
            
                // Read the 32-bit mask (First 4 bytes)
                const frame_info = view.getUint32(0, true);
                let offset = 4;
                const data = {};
            
                // 2. ITERATE THE SCHEMA
                for (let i = 0; i < SCHEMA.length; i++) {
                    if ((mask & (1 << i)) !== 0) {
                        const field = SCHEMA[i];
            
                        if (field.type === 'f64') {
                            data[field.name] = view.getFloat64(offset, true);
                            offset += 8;
                        } else {
                            data[field.name] = view.getFloat32(offset, true);
                            offset += 4;
                        }
                    }
                }

                /* Updating Dashboard */
                if (data.time) {
                    document.getElementById('utc').innerText = new Date(data.time * 1000).toISOString();
                }

                /*
                document.getElementById('lat').innerText = gps.lat;
                document.getElementById('len').innerText = gps.lon;
                document.getElementById('gps_status').innerText = gps.status;
                document.getElementById('gps_speed').innerText = gps.speed;
                document.getElementById('course').innerText = gps.course;
                */
                document.getElementById('status').innerText = "> LINK_STATE: ACTIVE";
            };

            socket.onclose = () => {
                document.getElementById('status').innerText = "> LINK_STATE: RECONNECTING...";
                setTimeout(startConnection, 2000);
            };
        }
        startConnection();
    </script>
</body>
</html>
